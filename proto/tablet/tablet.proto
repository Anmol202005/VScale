syntax = "proto3";

package tablet;

option go_package = "github.com/Anmol20102005/VScale/proto/tablet";

message QueryRequest {
    string sql = 1;
}

message QueryResponse {
    string message = 1;
}

message HealthRequest {}

message HealthResponse {
    bool healthy = 1;
}

service TabletService {
    rpc Execute(QueryRequest)
        returns (QueryResponse);
    
    rpc Health(HealthRequest)
        returns (HealthResponse);
}